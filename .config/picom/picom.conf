# ---------------------------------
#           Animations
# ---------------------------------

transition-length = 100
transition-pow-x = 0.2
transition-pow-y = 0.2
transition-pow-w = 0.2
transition-pow-h = 0.2
size-transition = true

# Open windows
animation-for-open-window = "zoom"
# Minimize or close windows
animation-for-unmap-window = "squeeze"
# Popup windows
animation-for-transient-window = "slide-up"  # Available options: slide-up, slide-down, slide-left, slide-right, squeeze, squeeze-bottom, zoom

# Animation for windows during tag change
animation-for-prev-tag = "minimize"
enable-fading-prev-tag = true
animation-for-next-tag = "slide-in-center"
enable-fading-next-tag = true

# ---------------------------------
#           Corners
# ---------------------------------

corner-radius = 5
round-borders = 3

# ---------------------------------
#           Shadows
# ---------------------------------

shadow = false
shadow-radius = 3
shadow-opacity = 0.5
shadow-offset-x = 0
shadow-offset-y = 0

# Exclude windows from having shadows
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'amberol'",
    "class_g ?= 'Notify-osd'",
    "class_g = 'Cairo-clock'",
    "class_g = 'slop'",
    "class_g = 'Polybar'",
    "_GTK_FRAME_EXTENTS@:c"
]

# ---------------------------------
#           Fading
# ---------------------------------

fading = true
fade-in-step = 0.03
fade-out-step = 0.03
fade-delta = 5

# Exclude windows from fading
fade-exclude = [
    "class_g = 'slop'"  # maim
]

# ---------------------------------
#           Transparency
# ---------------------------------

inactive-opacity = 0.9
active-opacity = 1.0
inactive-opacity-override = false

popup_menu = { opacity = 0.8 }
dropdown_menu = { opacity = 0.8 }

# Opacity rules
opacity-rule = [
	"80:class_g = 'Bar'",             # lemonbar
	"100:class_g = 'slop'",           # maim
	"100:class_g = 'TelegramDesktop'",
	"100:class_g = 'Thunderbird'",
	"80:class_g = 'tabbed'",
	"90:class_g = 'obsidian' && focused",
	"90:class_g = 'obsidian' && focused",
	"95:class_g = 'firefox' && focused",
	"85:class_g = 'Rofi'",
]

# Focus Exclusions
focus-exclude = [
    "class_g = 'Cairo-clock'",
    "class_g = 'Bar'",  # lemonbar
    "class_g = 'slop'"  # maim
]

# ---------------------------------
#       Background-Blurring
# ---------------------------------

blur: {
    method = "dual_kawase"
			strength = 2         # <--- Try 7 for a nice frosted look
			background = true     # <--- Set this to true to actually apply the blur
			background-frame = false
			background-fixed = false
			kern = "3x3box"
}

# Exclude conditions for background blur

blur-background-exclude = [
    "window_type = 'menu'",
    "window_type = 'dropdown_menu'",
    "window_type = 'popup_menu'",
    "window_type = 'tooltip'",
    "window_type = 'utility'",
    "class_g = 'slop'",
    "_GTK_FRAME_EXTENTS@:c"
];


# ---------------------------------
#         General Settings
# ---------------------------------

backend = "glx";            # Keep GLX, it's best for Intel/NVIDIA
vsync = true;               # <--- Change this to true
#glx-no-stencil = true;      # Performance boost
#glx-no-rebind-pixmap = true; # Helps with flickering
use-damage = false;          # Usually better for performance, set to false only if you see glitches
xrender-sync-fence = true;   # Often fixes lag on Intel drivers
unredir-if-possible = false;     # <--- Prevents flickering on Intel
# Client opacity detection
detect-client-opacity = true

# Window detection settings
log-level = "info"

# Uncomment to enable logging
# log-file = '/path/to/your/log/file'
# show-all-xerrors = false
