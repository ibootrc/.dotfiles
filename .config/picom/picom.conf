#;; ---------------------------------
#           Animations
# ---------------------------------

transition-length = 400
transition-pow-x = 0.7
transition-pow-y = 0.7
transition-pow-w = 0.7
transition-pow-h = 0.7
size-transition = true

# Open windows
animation-for-open-window = "zoom"
animation-for-unmap-window = "zoom"
animation-for-transient-window = "zoom"

# Animation for windows during tag change
animation-for-prev-tag = "slide-right"
enable-fading-prev-tag = true
animation-for-next-tag = "slide-left"
enable-fading-next-tag = true


#;; ---------------------------------
#           Corners
# ---------------------------------

corner-radius = 5
round-borders = 3


#;; ---------------------------------
#           Shadows
# ---------------------------------

shadow = false
shadow-radius = 3
shadow-opacity = 0.5
shadow-offset-x = 0
shadow-offset-y = 0

shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'amberol'",
    "class_g ?= 'Notify-osd'",
    "class_g = 'Cairo-clock'",
    "class_g = 'slop'",
    "class_g = 'Polybar'",
    "_GTK_FRAME_EXTENTS@",
]


#;; ---------------------------------
#           Fading
# ---------------------------------

fading = true
fade-in-step = 0.03
fade-out-step = 0.03
fade-delta = 5

fade-exclude = [
    "class_g = 'slop'"
]


#;; ---------------------------------
#        Transparency / Opacity
# ---------------------------------

inactive-opacity = 0.95
active-opacity = 1.0
inactive-opacity-override = false

# Keep menus readable
popup_menu = { opacity = 1.0 }
dropdown_menu = { opacity = 1.0 }

opacity-rule = [
    "80:class_g = 'Bar'",
    "100:class_g = 'slop'",
    "100:class_g = 'TelegramDesktop'",
    "100:class_g = 'Thunderbird'",
    "80:class_g = 'tabbed'",
    "90:class_g = 'obsidian' && focused",
    "95:class_g = 'firefox' && focused",

    # Rofi - translucent so background blur is visible
    "50:class_g = 'Rofi'",

    "90:class_g = 'dolphin'",
    "90:class_g = 'Zathura'",
    "85:class_g = 'i3bar'",
]


#;; ---------------------------------
#         Focus Exclusions
# ---------------------------------

focus-exclude = [
    "class_g = 'Cairo-clock'",
    "class_g = 'Bar'",
    "class_g = 'slop'"
]


#;; ---------------------------------
#       Background Blurring
# ---------------------------------

blur: {
    method = "dual_kawase"
    strength = 6
    background = true
    background-frame = false
    background-fixed = false
    kern = "3x3box"
}

# Do NOT exclude Firefox here.
# Rofi will blur whatever is behind its transparent area.

blur-background-exclude = [
    "window_type = 'menu'",
    "window_type = 'dropdown_menu'",
    "window_type = 'popup_menu'",
    "window_type = 'tooltip'",
    "window_type = 'utility'",
    "class_g = 'slop'",
    "_GTK_FRAME_EXTENTS@",
]


#;; ---------------------------------
#         General Settings
# ---------------------------------

# GLX is recommended for background blur
backend = "glx"

vsync = true
use-damage = false

# Helps with some Intel/NVIDIA setups
xrender-sync-fence = true
unredir-if-possible = false
glx-copy-from-front = true

# Client opacity detection
detect-client-opacity = true

# Window detection settings
log-level = "info"

# Uncomment to enable logging
# log-file = '/path/to/your/log/file'
# show-all-xerrors = false
