# Source tmux reset configuration
source-file ~/.config/tmux/tmux.reset.conf
set-option -g default-terminal "tmux-256color"
set-option -ag terminal-features ",xterm-kitty:RGB"
set-option -ag terminal-overrides ",xterm-kitty:Tc"
set-option -ag terminal-overrides ',xterm-kitty:Ss=:Se='

# --- BASIC SETTINGS ---
set -g prefix C-a
set -g base-index 1
set -g detach-on-destroy off
set -g escape-time 0
set -g history-limit 1000000
set -g renumber-windows on
set -g status-position top
setw -g mode-keys vi
set -g display-time 1000
set -g set-clipboard on
set -s copy-command 'xclip -selection clipboard'
set -g mouse on

# --- STYLING & COLORS ---
set -g pane-border-lines simple
set -g pane-border-style 'fg=colour255'
set -g pane-active-border-style 'fg=#1b668f'

# Popups and Menus
set -gF popup-style "bg=default,fg=#1b668f"
set -gF popup-border-style "fg=#1b668f"
set -gF menu-selected-style "bg=#1b668f,fg=#01D8DD"

# Mode Style (Selection in copy mode)
set -g mode-style "bg=#1b668f,fg=#01D8DD,bold"

# Message Styles
set -g message-style "bg=#1b668f,fg=#01D8DD"
set -g message-command-style "bg=#D0679D,fg=#FAE4FC"

# --- STATUS BAR ---
set -g status-bg '#365366'
set -g window-status-format "#[fg=#E4F0FB,bg=black] #I:#W "
set -g window-status-current-format "#[fg=#01D8DD,bg=#1b668f,bold] #I:#W "
set -g status-left '#[fg=#E4F0FB,bg=#D0679D,bold] [#S] '
set -g status-right ''

# --- PLUGINS (TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# Initialize TPM
run '~/.tmux/plugins/tpm/tpm'
